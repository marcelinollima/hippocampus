[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hippocampus-mcp"
dynamic = ["version"]
description = "Self-hosted long-term memory for Claude Code: hybrid search (BM25 + vectors + link graph) over plain Markdown, served over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Marcelino Lima" }]
keywords = ["mcp", "claude", "claude-code", "memory", "rag", "knowledge-graph", "embeddings"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.2,<3",
  "fastembed>=0.8,<1",
  "numpy>=1.26",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
hippocampus = "hippocampus.cli:main"

[project.urls]
Homepage = "https://github.com/marcelinollima/hippocampus"
Issues = "https://github.com/marcelinollima/hippocampus/issues"

[tool.hatch.version]
path = "src/hippocampus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hippocampus"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
