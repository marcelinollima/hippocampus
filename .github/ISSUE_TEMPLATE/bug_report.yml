name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please redact hostnames, tokens and anything from your real memories."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version (`hippocampus --version`)
  - type: dropdown
    id: deploy
    attributes:
      label: How do you run the server?
      options: [Docker Compose, systemd, local / pip, other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs and/or ~/.hippocampus/*.log on the client
      render: text
