name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your daily use where you missed it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
